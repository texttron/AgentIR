[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentir"
version = "0.1.0"
description = "Retriever, augmentation, reranking, and evaluation code for AgentIR."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.9.0",
    "datasets>=4.0.0",
    "deepspeed>=0.17.2",
    "faiss-cpu>=1.11.0.post1",
    "flash-attn",
    "json5>=0.12.0",
    "numpy>=1.26.4",
    "openai>=1.97.0",
    "onnxruntime==1.22.1",
    "peft==0.18.0",
    "python-dotenv>=1.1.1",
    "qwen-agent[gui,mcp,rag]==0.0.27",
    "qwen-omni-utils==0.0.8",
    "rich>=14.0.0",
    "tevatron",
    "tiktoken>=0.9.0",
    "torch",
    "torchvision",
    "tqdm>=4.67.1",
    "transformers==4.53.2",
    "vllm>=0.9.0",
    "zai-sdk>=0.2.1",
]

[project.optional-dependencies]
bm25 = [
    "pyserini>=1.2.0",
]

[tool.setuptools]
packages = [
    "evaluation",
    "evaluation.search_agent",
    "evaluation.search_agent.tools",
    "searcher",
    "searcher.rerankers",
    "searcher.searchers",
]

[tool.uv.sources]
tevatron = { git = "https://github.com/texttron/tevatron.git", rev = "main" }

[tool.uv]
no-build-isolation-package = ["flash-attn"]
